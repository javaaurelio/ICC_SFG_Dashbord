async function uploadEm5Partes() {

    const usuario = document.getElementById("usuario").value;
    const senha = document.getElementById("senha").value;
    const mailboxName = document.getElementById("mailboxName").value;
    const arquivo = document.getElementById("arquivo").files[0];

    if (!arquivo) {
        alert("Selecione um arquivo.");
        return;
    }

    const sessionId = crypto.randomUUID();
    const qquuid = crypto.randomUUID(); // único para todas as partes

    const totalSize = arquivo.size;
    const totalParts = 25;
    const chunkSize = Math.ceil(totalSize / totalParts);

    const uploads = [];

    for (let partIndex = 0; partIndex < totalParts; partIndex++) {

        const start = partIndex * chunkSize;
        const end = Math.min(start + chunkSize, totalSize);

        const chunk = arquivo.slice(start, end);

        const formData = new FormData();

        formData.append("qqfile", chunk, arquivo.name);
        formData.append("blob", chunk, "blob");

        formData.append("mailboxName", mailboxName);
        formData.append("globalmailboxuser", "false");
        formData.append("userId", usuario);

        formData.append("sessionId", sessionId);

        formData.append("qqpartindex", partIndex);
        formData.append("qqpartbyteoffset", start);
        formData.append("qqchunksize", chunk.size);

        formData.append("qqtotalparts", totalParts);
        formData.append("qqtotalfilesize", totalSize);
        formData.append("qquuid", qquuid);

        uploads.push(
            fetch(
                `https://fgw.des.cluster1.node1.host:5076/sfgapis/document/uploadfile/${usuario}`,
                {
                    method: "POST",
                    headers: {
                        Authorization: "Basic " + btoa(`${usuario}:${senha}`)
                    },
                    body: formData
                }
            )
        );
    }

    const responses = await Promise.all(uploads);

    responses.forEach((response, index) => {
        console.log(
            `Parte ${index + 1}/${totalParts} enviada`,
            response.status
        );
    });

    await uploadSuccess(
        usuario,
        senha,
        mailboxName,
        arquivo,
        sessionId,
        qquuid
    );

    alert("Sucesso");
}

async function enviar() {

    const usuario = document.getElementById("usuario").value;
    const senha = document.getElementById("senha").value;
    const mailboxName = document.getElementById("mailboxName").value;
    const arquivo = document.getElementById("arquivo").files[0];

    if (!arquivo) {
        alert("Selecione um arquivo.");
        return;
    }

    const sessionId = crypto.randomUUID();
    const qquuid = crypto.randomUUID();

    const formData = new FormData();

    formData.append("qqfile", arquivo, "blob");
    formData.append("mailboxName", mailboxName);
    formData.append("globalmailboxuser", "false");
    formData.append("userId", usuario);
    formData.append("sessionId", sessionId);
    formData.append("qqpartindex", "0");
    formData.append("qqpartbyteoffset", "0");
    formData.append("qqchunksize", arquivo.size);
    formData.append("qqtotalparts", "1");
    formData.append("qqtotalfilesize", arquivo.size);
    formData.append("qquuid", qquuid);
	formData.append("qqfilename", arquivo.name);

//    campo blob exigido pela API
    formData.append("blob", arquivo, "blob");

    const auth = btoa(`${usuario}:${senha}`);

    try {

        const response = await fetch(
            `https://fgw.des.cluster1.node1.host:5076/sfgapis/document/uploadfile/${usuario}`,
            {
                method: "POST",
                headers: {
                    "Authorization": `Basic ${auth}`
                },
                body: formData
            }
        );

        const texto = await response.text();

        document.getElementById("resultado").innerHTML =
				`Status: ${response.status}

				SessionId: ${sessionId}
				QQUUID: ${qquuid}

				Resposta:
				${texto}`;
				
		if (response.ok) {
			await uploadSuccess(
					usuario,
					senha,
					"/TESTEP_OOQET",
					arquivo,
					sessionId,
					qquuid
				);
				alert("Sucesso");
		} else {
			console.log("Erro no upload");
		
		}		
				
				
    } catch (e) {

        document.getElementById("resultado").innerHTML =
			`Erro:

			${e.message}`;

        console.error(e);
    }
}

async function uploadSuccess(
    usuario,
    senha,
    mailboxName,
    arquivo,
    sessionId,
    qquuid
) {
    return fetch(
        `https://fgw.des.cluster1.node1.host:5076/sfgapis/document/uploadsuccess` +
        `?qquuid=${encodeURIComponent(qquuid)}` +
        `&qqfilename=${encodeURIComponent(arquivo.name)}` +
        `&mailboxName=${encodeURIComponent(mailboxName)}` +
        `&globalmailboxuser=false` +
        `&userId=${encodeURIComponent(usuario)}` +
        `&sessionId=${encodeURIComponent(sessionId)}`,
        {
            method: "POST",
            headers: {
                Authorization: `Basic ${btoa(`${usuario}:${senha}`)}`,
				"Content-Type": "application/x-www-form-urlencoded"
            },
			body: ""
        }
    );
}


async function carregarMailbox() {

    const usuario = document
        .getElementById("usuario")
        .value
        .trim();

    if (!usuario) {
        document.getElementById("mailboxName").value = "";
        return;
    }

    try {

        document.getElementById("mailboxName").value =
            "Consultando mailbox...";

        const mailbox =
            await obterProducerMailboxPath(usuario);
			
		mailboxName = mailbox;

        document.getElementById("mailboxName").value =
            mailbox
                ? `${mailbox}`
                : "<nao-localizada>";

    } catch (e) {

        document.getElementById("mailboxName").value =
            `Erro: ${e.message}`;
    }
}

async function obterProducerMailboxPath(producer) {
    const url =
        "https://fgw.des.cluster1.node1.host:5076/B2BAPIs/svc/routingchannels/" +
        "?_range=0-999" +
        "&searchByConsumer="+
        "&searchByTemplate="+
        "&searchByProducer=" + producer;

    const response = await fetch(url, {
        method: "GET",
        headers: {
            "Accept": "application/json",
            "Content-Type": "application/json",
            "Authorization": "Basic " +
                btoa("infrafacil:123456")
        }
    });

    if (!response.ok) {
        throw new Error(`Erro HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!data || data.length === 0) {
        return null;
    }
    return data[0].producerMailboxPath;
}
